# Nginx server block để serve dự án này (build tĩnh, 100% client-side, không backend) từ thư
# mục `dist/` dưới dạng subdomain scoring.toniqhz.com.
#
# CẦN SỬA trước khi dùng:
#   1. root  -> đổi thành đường dẫn tuyệt đối tới thư mục `dist/` đã build (chạy `npm run build`
#      trong repo rồi copy/deploy thư mục dist ra đây, hoặc trỏ thẳng vào <đường-dẫn-repo>/dist
#      nếu build ngay trên server).
#   2. Phần HTTPS (khối server 443) đang comment sẵn — bỏ comment và điền đường dẫn chứng chỉ
#      sau khi có SSL (vd cấp bằng certbot: `certbot --nginx -d scoring.toniqhz.com`).
#
# Cài đặt: copy file này vào /etc/nginx/sites-available/scoring.conf, rồi:
#   ln -s /etc/nginx/sites-available/scoring.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name scoring.toniqhz.com;

    root /var/www/scoring/dist;
    index index.html;

    # Ứng dụng chạy hoàn toàn client-side, không có route con theo URL (chỉ 1 trang), nhưng vẫn
    # dùng try_files kiểu SPA cho an toàn — truy cập bất kỳ path nào cũng trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # LƯU Ý: add_header trong 1 location KHÔNG cộng dồn với add_header ở block server cha — nó
    # thay thế hoàn toàn (hành vi hay gây lỗi của nginx). Vì 3 location dưới đây tự đặt
    # add_header (Cache-Control) riêng, phải lặp lại 3 header bảo mật trong chính từng location
    # đó, nếu không chúng sẽ bị mất ở các path này.

    # Vite build ra tên file có hash nội dung (vd assets/index-ABC123.js) -> nội dung 1 hash
    # KHÔNG BAO GIỜ đổi, nên cache dài hạn + immutable là an toàn tuyệt đối.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Các file tĩnh KHÔNG có hash trong tên (opencv.js ~11MB, font .ttf, favicon...) — tên file
    # giữ nguyên qua các lần deploy nên chỉ cache vừa phải, để lần deploy sau trình duyệt sớm lấy
    # bản mới (nginx tự thêm ETag/Last-Modified nên vẫn revalidate được qua cache này).
    location ~* \.(?:ttf|woff2?|svg|ico|png|jpg|jpeg)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /opencv/opencv.js {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # pdfjs-dist xuất worker dạng .mjs — đảm bảo đúng MIME type application/javascript, nếu
    # không trình duyệt sẽ từ chối nạp module worker vì kiểm tra MIME nghiêm ngặt.
    # (default_type không phải add_header nên vẫn kế thừa 3 header bảo mật ở dưới bình thường.)
    location ~ \.mjs$ {
        default_type application/javascript;
    }

    # Nén để giảm tải nhất là opencv.js (~11MB text, nén gzip còn khoảng 1/3).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/wasm
        font/ttf
        image/svg+xml;

    # Không cho phép nhúng iframe từ site khác + chặn sniff sai content-type.
    # Áp dụng cho location "/" và ".mjs" (2 nơi duy nhất không tự đặt add_header riêng) —
    # 3 location còn lại (assets/, font/ảnh tĩnh, opencv.js) đã lặp lại 3 dòng này ở trên.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

